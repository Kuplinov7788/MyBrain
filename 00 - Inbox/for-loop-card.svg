<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152d"/>
      <stop offset="0.55" stop-color="#0a2750"/>
      <stop offset="1" stop-color="#0b1530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="955" cy="112" r="250" fill="#385dff" opacity=".14"/>
  <circle cx="76" cy="1018" r="310" fill="#00d8ff" opacity=".10"/>
  <path d="M-30 210C180 100 280 290 480 175S840 123 1110 260" fill="none" stroke="#71eaff" stroke-opacity=".10" stroke-width="3"/>

  <rect x="76" y="72" width="232" height="52" rx="26" fill="#163a66" stroke="#4dc9ff" stroke-opacity=".55"/>
  <text x="192" y="106" fill="#aee9ff" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="2">JAVASCRIPT</text>

  <text x="76" y="220" fill="#ffffff" font-family="Arial, sans-serif" font-size="86" font-weight="800">FOR LOOP</text>
  <text x="80" y="280" fill="#9ebbd9" font-family="Arial, sans-serif" font-size="30">Bir xil amalni bir necha marta bajarish uchun</text>

  <g filter="url(#shadow)">
    <rect x="76" y="348" width="928" height="438" rx="30" fill="#081222" stroke="#2c527d" stroke-width="2"/>
    <rect x="76" y="348" width="928" height="66" rx="30" fill="#111f37"/>
    <path d="M76 390h928v24H76z" fill="#111f37"/>
    <circle cx="120" cy="381" r="10" fill="#ff6b6b"/>
    <circle cx="154" cy="381" r="10" fill="#ffd166"/>
    <circle cx="188" cy="381" r="10" fill="#4ade80"/>
    <text x="920" y="389" fill="#7f9bbd" font-family="Menlo, Monaco, monospace" font-size="19" text-anchor="end">loop.js</text>

    <g font-family="Menlo, Monaco, monospace" font-size="34">
      <text x="122" y="493" fill="#526b8c">1</text>
      <text x="122" y="559" fill="#526b8c">2</text>
      <text x="122" y="625" fill="#526b8c">3</text>
      <text x="122" y="691" fill="#526b8c">4</text>
      <text x="196" y="493" fill="#c084fc">for</text>
      <text x="259" y="493" fill="#e7f0ff"> (</text>
      <text x="297" y="493" fill="#6ee7ff">let</text>
      <text x="365" y="493" fill="#e7f0ff"> i = </text>
      <text x="466" y="493" fill="#f8d277">0</text>
      <text x="490" y="493" fill="#e7f0ff">; i &lt; </text>
      <text x="605" y="493" fill="#f8d277">5</text>
      <text x="629" y="493" fill="#e7f0ff">; i++) {</text>
      <text x="196" y="559" fill="#6ee7ff">console</text>
      <text x="338" y="559" fill="#e7f0ff">.</text>
      <text x="360" y="559" fill="#a7f3d0">log</text>
      <text x="420" y="559" fill="#e7f0ff">(i);</text>
      <text x="196" y="691" fill="#e7f0ff">}</text>
    </g>
  </g>

  <g transform="translate(76 856)">
    <rect width="928" height="136" rx="28" fill="#0d2947" stroke="#3579af" stroke-opacity=".7"/>
    <rect x="28" y="28" width="80" height="80" rx="20" fill="url(#accent)"/>
    <text x="68" y="83" fill="#081222" font-family="Arial, sans-serif" font-size="45" font-weight="900" text-anchor="middle">i</text>
    <text x="140" y="58" fill="#d9f1ff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Qanday ishlaydi?</text>
    <text x="140" y="96" fill="#9ec5e8" font-family="Arial, sans-serif" font-size="24">i 0 dan boshlanadi va 5 ga yetguncha takrorlanadi.</text>
  </g>

  <text x="1004" y="1036" fill="#6383a8" font-family="Arial, sans-serif" font-size="19" text-anchor="end">CODE BASICS</text>
</svg>
